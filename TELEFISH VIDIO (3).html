<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TELEFISH VIDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#0b2b33;--mute:#5d7a80;--line:#d5e2e0;--accent:#0a7cff;--accent2:#ff6b4a;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a1f;--card:#0d2a31;--ink:#e6f4f2;--mute:#8fb0b3;--line:#1b434b;--on:#fff}}
:root[data-theme="dark"]{--bg:#071a1f;--card:#0d2a31;--ink:#e6f4f2;--mute:#8fb0b3;--line:#1b434b;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;letter-spacing:.5px;direction:ltr;cursor:pointer;white-space:nowrap;background:none;border:0}
.logo img{width:40px;height:40px;object-fit:contain;display:block}
.logo b{color:var(--accent)}
.search{flex:1;min-width:0;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.btn{background:var(--accent);color:var(--on);border:0;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{cursor:pointer;background:none;border:0;padding:0;text-align:start;display:block;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0b2b33}
.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.dur{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.75);color:#fff;font-size:.75rem;padding:1px 7px;border-radius:6px;direction:ltr}
.card h3{margin:8px 0 0;font-size:1rem;line-height:1.4}
.meta{color:var(--mute);font-size:.85rem}
.empty{text-align:center;padding:70px 16px;color:var(--mute)}
.empty img{width:120px;height:120px}
.empty h2{color:var(--ink);margin:10px 0 4px}
.watch{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:980px;margin:0 auto}
.watch video{width:100%;max-height:70vh;background:#000;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.desc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(520px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-weight:600;margin:12px 0 4px}
.field{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;display:none;z-index:20}
.auth{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.auth h2{margin:0 0 4px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs .btn{flex:1}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;font-size:.8rem;font-weight:800;margin-inline-end:6px}
.err{color:var(--accent2);min-height:1.4em;font-size:.9rem;margin-top:8px}
.hide{display:none!important}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0a4fd6 0,#062a7a 45%,#030f2e 100%);color:#fff;overflow:hidden;transition:opacity .6s ease,visibility .6s}
#intro.out{opacity:0;visibility:hidden}
.stage{display:grid;justify-items:center;gap:22px;direction:ltr}
.mark{position:relative;width:clamp(120px,34vw,190px);aspect-ratio:1}
.mark img{position:relative;width:100%;height:100%;object-fit:contain;animation:drop 1s cubic-bezier(.2,1.3,.4,1) .2s both}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(120,200,255,.8);animation:ring 1.6s ease-out .9s 2 both}
.ring.r2{animation-delay:1.3s}
.word{font-weight:800;font-size:clamp(1.4rem,6vw,2.2rem);letter-spacing:.35em;padding-left:.35em;display:flex}
.word span{opacity:0;transform:translateY(14px);animation:rise .5s ease forwards}
.word i{font-style:normal;color:#6fd0ff}
.tag{opacity:0;font-size:.95rem;color:#a9c9ff;animation:rise .6s ease 2s forwards}
.load{width:min(220px,50vw);height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.load b{display:block;height:100%;width:0;background:#6fd0ff;animation:fill 3s linear forwards}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
@keyframes drop{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
.reels{display:flex;flex-direction:column;align-items:center;gap:16px;max-height:80vh;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{position:relative;flex:none;width:min(420px,100%);height:min(78vh,740px);border-radius:16px;overflow:hidden;background:#000;scroll-snap-align:center}
.reel img{width:100%;height:100%;object-fit:cover;display:block}
.watch img{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:12px}
.reel video{width:100%;height:100%;object-fit:cover;cursor:pointer}
.cap{position:absolute;bottom:0;inset-inline:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;pointer-events:none}
.rl{position:absolute;inset-inline-end:12px;bottom:90px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer}
@media (max-width:560px){.logo span{display:none}}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="TELEFISH VIDIO">
  <button class="skip" id="skip">تخطي</button>
  <div class="stage">
    <div class="mark"><span class="ring"></span><span class="ring r2"></span><img id="introLogo" alt=""></div>
    <div class="word" aria-label="TELEFISH VIDIO" id="word"></div>
    <div class="tag">شارك فيديوهاتك واحفظها</div>
    <div class="load"><b></b></div>
  </div>
</div>
<header>
  <button class="logo" id="home" aria-label="TELEFISH VIDIO">
    <img id="logoImg" alt="" width="40" height="40">
    <span>TELE<b>FISH</b> VIDIO</span>
  </button>
  <input class="search hide" id="q" type="search" placeholder="ابحث في الفيديوهات" aria-label="بحث">
  <button class="btn ghost hide" id="upReel" aria-label="رفع ريلز" title="رفع ريلز"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg></button>
  <button class="btn hide" id="up">رفع فيديو</button>
  <button class="btn ghost hide" id="me"></button>
</header>

<main id="view"></main>

<dialog id="dlg">
  <h2 style="margin:0 0 4px" id="dt">رفع فيديو جديد</h2>
  <div class="drop" id="drop" tabindex="0" role="button">اضغط لاختيار ملف فيديو</div>
  <input type="file" id="file" accept="video/*" hidden>
  <label for="t">العنوان</label>
  <input class="field" id="t" maxlength="100">
  <label for="d">الوصف</label>
  <textarea class="field" id="d" rows="3" maxlength="1000"></textarea>
  <div class="bar" id="bar"><i id="barI"></i></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button class="btn ghost" id="cancel">إلغاء</button>
    <button class="btn" id="save">نشر وحفظ</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

['icon','apple-touch-icon'].forEach(r => { const l = document.createElement('link'); l.rel = r; l.type = 'image/png'; l.href = LOGO; document.head.appendChild(l); });

// --- Intro splash ---
(function(){
  $('#introLogo').src = LOGO;
  const w = $('#word'); const txt = 'TELEFISH VIDIO';
  [...txt].forEach((ch,i) => { const sp = document.createElement('span'); sp.style.animationDelay = (1.1 + i*0.06) + 's'; sp.innerHTML = ch === ' ' ? '&nbsp;' : ch; if(i >= 4 && i < 8) sp.style.color = '#6fd0ff'; w.appendChild(sp); });
  const intro = $('#intro'); let done = false;
  const end = () => { if(done) return; done = true; intro.classList.add('out'); setTimeout(() => intro.remove(), 700); };
  $('#skip').onclick = end;
  setTimeout(end, 3300);
})();

let db = null, videos = [], current = null, urls = {};

// --- Storage: IndexedDB (videos saved as files in the browser) ---
function openDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('telefish-vidio', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('videos', {keyPath:'id'});
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const tx = (mode) => db.transaction('videos', mode).objectStore('videos');
const reqP = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
async function loadAll(){
  if(!db || !acc){ videos = []; return; }
  try{
    const all = await reqP(tx('readonly').getAll());
    for(const v of all){ if(!v.owner && !acc.guest && users().length === 1){ v.owner = acc.id; await put(v); } }
    videos = all.filter(v => v.owner).sort((a,b)=>b.date-a.date);
  }catch(e){ videos = []; }
}
async function put(v){ if(db){ try{ await reqP(tx('readwrite').put(v)); }catch(e){ toast('تعذر الحفظ: المساحة ممتلئة'); } } }
async function del(id){ if(db){ try{ await reqP(tx('readwrite').delete(id)); }catch(e){} } }

function url(v){ return urls[v.id] || (urls[v.id] = URL.createObjectURL(v.blob)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tab = 'all';
const subs = () => LS.get('tf_subs') || {};
const isSub = o => (subs()[acc.id] || []).includes(o);
const subCount = o => Object.values(subs()).filter(a => a.includes(o)).length;
const likeCount = v => (v.likesBase || 0) + (v.likedBy || []).length;
const inTab = v => tab === 'reels' ? !!v.reel : (v.reel && tab !== 'mine') ? false : tab === 'all' || (tab === 'mine' ? v.owner === acc.id : (subs()[acc.id] || []).includes(v.owner));
function subHtml(v){
  if(v.owner === acc.id || v.owner === 'guest') return '';
  return `<button class="btn ${isSub(v.owner)?'ghost':''}" id="sub">${isSub(v.owner)?'تم الاشتراك':'اشتراك'}</button><span class="meta" id="subc">${subCount(v.owner)} مشترك</span>`;
}
function ownerName(v){ const u = users().find(x => x.id === v.owner); return u ? u.name : (v.ownerName || (v.owner === 'guest' ? 'ضيف' : 'مستخدم')); }
function tabsHtml(){ return `<div class="row" style="margin-bottom:14px"><button class="btn ${tab==='all'?'':'ghost'}" data-tab="all">كل الفيديوهات</button><button class="btn ${tab==='reels'?'':'ghost'}" data-tab="reels">ريلز</button><button class="btn ${tab==='subs'?'':'ghost'}" data-tab="subs">الاشتراكات</button><button class="btn ${tab==='mine'?'':'ghost'}" data-tab="mine">فيديوهاتي</button></div>`; }
function bindTabs(){ document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderHome(); }); }
function fmtDate(t){ return new Date(t).toLocaleDateString('ar'); }
function fmtDur(s){ s = Math.round(s||0); const m = Math.floor(s/60); return m + ':' + String(s%60).padStart(2,'0'); }
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 2600); }

// --- Views ---
function renderHome(){
  if(!acc) return;
  current = null;
  const q = $('#q').value.trim().toLowerCase();
  const list = videos.filter(v => inTab(v) && (!q || v.title.toLowerCase().includes(q) || (v.desc||'').toLowerCase().includes(q)));
  const el = $('#view');
  if(!list.length){
    el.innerHTML = tabsHtml() + `<div class="empty"><img src="${LOGO}" alt="" width="120" height="120">
    <h2>${q ? 'لا توجد نتائج' : 'لا توجد فيديوهات بعد'}</h2>
    <p>${q ? 'جرّب كلمات بحث أخرى.' : 'ارفع أول فيديو لك وسيُحفظ هنا.'}</p>
    ${q ? '' : '<button class="btn" id="up2">رفع فيديو</button>'}</div>`;
    bindTabs();
    const u = $('#up2'); if(u) u.onclick = () => openUpload(tab === 'reels');
    return;
  }
  if(tab === 'reels'){ renderReels(list, el); return; }
  el.innerHTML = tabsHtml() + '<div class="grid">' + list.map(v => `
    <button class="card" data-id="${v.id}">
      <div class="thumb">${v.image ? `<img src="${url(v)}" alt="" style="width:100%;height:100%;object-fit:cover">` : `<video src="${url(v)}#t=0.5" preload="metadata" muted playsinline data-d="1"></video><span class="dur"></span>`}</div>
      <h3>${esc(v.title)}</h3>
      <div class="meta">${esc(ownerName(v))} · ${v.views} مشاهدة · ${fmtDate(v.date)}</div>
    </button>`).join('') + '</div>';
  bindTabs();
  el.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openVideo(c.dataset.id);
    const vid = c.querySelector('video');
    if(vid) vid.onloadedmetadata = () => c.querySelector('.dur').textContent = fmtDur(vid.duration);
  });
}

function ensureLikes(v){ if(!v.likedBy){ v.likedBy = []; v.likesBase = v.likes || 0; } }
const heart = v => { ensureLikes(v); return (v.likedBy.includes(acc.id) ? '♥ ' : '♡ ') + likeCount(v); };
function renderReels(list, el){
  el.innerHTML = tabsHtml() + '<div class="reels">' + list.map(v => `<div class="reel">${v.image ? `<img src="${url(v)}" alt="${esc(v.title)}">` : `<video src="${url(v)}" loop playsinline preload="metadata"></video>`}<div class="cap"><b>${esc(ownerName(v))}</b><div>${esc(v.title)}</div></div><button class="rl" data-like="${v.id}" aria-label="إعجاب">${heart(v)}</button></div>`).join('') + '</div>';
  bindTabs();
  const io = new IntersectionObserver(es => es.forEach(e => { const vd = e.target.querySelector('video'); if(!vd) return; if(e.isIntersecting && e.intersectionRatio > .7) vd.play().catch(() => {}); else vd.pause(); }), {threshold:[0,.7]});
  el.querySelectorAll('.reel').forEach(r => { io.observe(r); const vd = r.querySelector('video'); if(vd) vd.onclick = () => vd.paused ? vd.play() : vd.pause(); });
  el.querySelectorAll('[data-like]').forEach(b => b.onclick = async () => {
    if(acc.guest) return toast('أنشئ حسابًا للإعجاب');
    const v = videos.find(x => x.id === b.dataset.like); ensureLikes(v);
    const i = v.likedBy.indexOf(acc.id); if(i < 0) v.likedBy.push(acc.id); else v.likedBy.splice(i, 1);
    b.textContent = heart(v); await put(v);
  });
}

async function openVideo(id){
  const v = videos.find(x => x.id === id); if(!v) return;
  current = v; if(!v.likedBy){ v.likedBy = []; v.likesBase = v.likes || 0; } v.views++; await put(v);
  $('#view').innerHTML = `
  <div class="watch">
    <button class="btn ghost" id="back" style="justify-self:start">رجوع</button>
    ${v.image ? `<img src="${url(v)}" alt="${esc(v.title)}">` : `<video src="${url(v)}" controls autoplay playsinline></video>`}
    <h1 style="margin:0;font-size:1.4rem">${esc(v.title)}</h1>
    <div class="row">
      <span class="meta">${esc(ownerName(v))} · ${v.views} مشاهدة · ${fmtDate(v.date)}</span>
      ${subHtml(v)}
      <span style="flex:1"></span>
      <button class="btn ${v.likedBy.includes(acc.id)?'':'ghost'}" id="like">${v.likedBy.includes(acc.id)?'تم الإعجاب':'إعجاب'} (${likeCount(v)})</button>
      <button class="btn ghost" id="dl">تنزيل</button>
      ${v.owner === acc.id ? '<button class="btn danger" id="rm">حذف</button>' : ''}
    </div>
    ${v.desc ? `<div class="desc">${esc(v.desc)}</div>` : ''}
  </div>`;
  scrollTo(0,0);
  $('#back').onclick = renderHome;
  $('#like').onclick = async () => {
    if(acc.guest) return toast('أنشئ حسابًا للإعجاب بالفيديو');
    const i = v.likedBy.indexOf(acc.id);
    if(i < 0) v.likedBy.push(acc.id); else v.likedBy.splice(i, 1);
    const on = i < 0, b = $('#like');
    b.textContent = `${on ? 'تم الإعجاب' : 'إعجاب'} (${likeCount(v)})`; b.classList.toggle('ghost', !on);
    await put(v);
  };
  if($('#sub')) $('#sub').onclick = () => {
    if(acc.guest) return toast('أنشئ حسابًا للاشتراك');
    const all = subs(), mine = all[acc.id] || [], i = mine.indexOf(v.owner);
    if(i < 0) mine.push(v.owner); else mine.splice(i, 1);
    all[acc.id] = mine; LS.set('tf_subs', all);
    const on = i < 0, b = $('#sub');
    b.textContent = on ? 'تم الاشتراك' : 'اشتراك'; b.classList.toggle('ghost', on);
    $('#subc').textContent = subCount(v.owner) + ' مشترك';
  };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = url(v); a.download = v.fileName || (v.title + (v.image ? '.jpg' : '.mp4')); a.click(); };
  if($('#rm')) $('#rm').onclick = async () => {
    if(!confirm('هل تريد حذف هذا الفيديو نهائيًا؟')) return;
    await del(v.id); URL.revokeObjectURL(urls[v.id]); delete urls[v.id];
    videos = videos.filter(x => x.id !== v.id); toast('تم الحذف'); renderHome();
  };
}

// --- Upload ---
let picked = null;
let reelMode = false;
function openUpload(r){ if(!acc) return; reelMode = !!r; $('#dt').textContent = r ? 'رفع ريلز جديد (فيديو حتى 90 ثانية أو صورة)' : 'رفع فيديو جديد'; picked = null; $('#t').value = ''; $('#d').value = ''; $('#file').accept = r ? 'video/*,image/*' : 'video/*'; $('#file').value = ''; $('#drop').textContent = r ? 'اضغط لاختيار فيديو أو صورة' : 'اضغط لاختيار ملف فيديو'; $('#bar').style.display = 'none'; $('#dlg').showModal(); }
$('#up').onclick = () => openUpload(false);
$('#upReel').onclick = () => openUpload(true);
$('#cancel').onclick = () => $('#dlg').close();
$('#drop').onclick = () => $('#file').click();
$('#drop').onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('#file').click(); } };
$('#file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  picked = f; $('#drop').textContent = f.name + ' (' + (f.size/1048576).toFixed(1) + ' MB)';
  if(!$('#t').value) $('#t').value = f.name.replace(/\.[^.]+$/, '');
};
$('#save').onclick = async () => {
  if(!picked){ toast('اختر ملف فيديو أولًا'); return; }
  const title = $('#t').value.trim(); if(!title){ toast('أدخل عنوان الفيديو'); return; }
  const isImg = picked.type.startsWith('image/');
  if(isImg && !reelMode){ toast('الصور تُرفع من أيقونة الريلز فقط'); return; }
  const dur = isImg ? 0 : await new Promise(r => { const t = document.createElement('video'); t.preload = 'metadata'; t.onloadedmetadata = () => { r(t.duration); URL.revokeObjectURL(t.src); }; t.onerror = () => r(0); t.src = URL.createObjectURL(picked); });
  if(reelMode && dur > 90){ toast('الريلز لا تزيد مدتها عن 90 ثانية'); return; }
  const bar = $('#bar'), fill = $('#barI'); bar.style.display = 'block';
  // progress is simulated: the file is stored locally, so this is fast
  fill.style.width = '40%';
  const v = {id: 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title, desc: $('#d').value.trim(), blob: picked, owner: acc.id, ownerName: acc.name, reel: reelMode, image: isImg, fileName: picked.name, date: Date.now(), views: 0, likes: 0};
  await put(v); fill.style.width = '100%';
  videos.unshift(v); if(reelMode) tab = 'reels'; $('#dlg').close(); toast('تم نشر الفيديو وحفظه'); renderHome();
};

$('#home').onclick = () => { if(!acc) return; $('#q').value = ''; renderHome(); };
$('#q').oninput = renderHome;

// --- Private accounts (stored in this browser) ---
let acc = null;
const GUEST = {id: 'guest', name: 'ضيف', guest: true};
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const users = () => LS.get('tf_users') || [];
async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tfv:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return btoa(unescape(encodeURIComponent('tfv:' + s))); }
}
function renderAuth(mode){
  current = null;
  ['#up','#upReel','#me','#q'].forEach(i => $(i).classList.add('hide'));
  const has = users().length > 0; if(!has) mode = 'new';
  $('#view').innerHTML = `<div class="auth">
    <h2>${mode === 'new' ? 'إنشاء حساب خاص' : 'تسجيل الدخول'}</h2>
    <div class="meta">فيديوهاتك محمية بحسابك ولا يراها أصحاب الحسابات الأخرى.</div>
    ${has ? `<div class="tabs"><button class="btn ${mode==='in'?'':'ghost'}" id="tIn">دخول</button><button class="btn ${mode==='new'?'':'ghost'}" id="tNew">حساب جديد</button></div>` : '<div style="height:8px"></div>'}
    <label for="an">اسم المستخدم</label><input class="field" id="an" maxlength="30" autocomplete="username">
    <label for="ap">الرمز السري (4 أحرف أو أكثر)</label><input class="field" id="ap" type="password" autocomplete="${mode==='new'?'new-password':'current-password'}">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" style="width:100%;margin-top:6px">${mode === 'new' ? 'إنشاء الحساب' : 'دخول'}</button>
    <div class="meta" style="text-align:center;margin:12px 0 8px">أو</div>
    <button class="btn ghost" id="guest" style="width:100%">الدخول كضيف</button>
    <div class="meta" style="margin-top:8px;font-size:.8rem">فيديوهات الضيف تُحفظ في مساحة الضيف على هذا الجهاز ويراها كل من يدخل كضيف.</div>
  </div>`;
  if(has){ $('#tIn').onclick = () => renderAuth('in'); $('#tNew').onclick = () => renderAuth('new'); }
  const fail = m => $('#err').textContent = m;
  const submit = async () => {
    const name = $('#an').value.trim(), pin = $('#ap').value;
    if(!name) return fail('أدخل اسم المستخدم');
    if(pin.length < 4) return fail('الرمز السري يجب ألا يقل عن 4 أحرف');
    const h = await sha(pin), list = users();
    const found = list.find(u => u.name.toLowerCase() === name.toLowerCase());
    if(mode === 'new'){
      if(found) return fail('اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر');
      const u = {id: 'u' + Date.now().toString(36), name, h};
      list.push(u); LS.set('tf_users', list); signIn(u);
    }else{
      if(!found || found.h !== h) return fail('اسم المستخدم أو الرمز السري غير صحيح');
      signIn(found);
    }
  };
  $('#go').onclick = submit;
  $('#guest').onclick = () => signIn(GUEST);
  $('#ap').onkeydown = e => { if(e.key === 'Enter') submit(); };
}
async function signIn(u){
  acc = u; LS.set('tf_session', u.guest ? null : u.id);
  $('#me').innerHTML = `<span class="av">${esc([...u.name][0].toUpperCase())}</span>خروج`;
  ['#up','#upReel','#me','#q'].forEach(i => $(i).classList.remove('hide'));
  $('#q').value = ''; await loadAll(); renderHome(); toast('أهلًا ' + u.name);
}
$('#me').onclick = () => { acc = null; videos = []; LS.set('tf_session', null); renderAuth('in'); toast('تم تسجيل الخروج'); };

(async () => {
  db = await openDB();
  const u = users().find(x => x.id === LS.get('tf_session'));
  if(u) signIn(u); else renderAuth('new');
})();
</script>
</body>
